[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-can-lab"
version = "0.2.0"
description = "Synthetic CAN communication and transport-independent automotive telemetry"
requires-python = ">=3.12"
dependencies = ["python-can>=4.6,<5", "cantools>=40,<42"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
excel = ["pandas>=2.2,<4", "openpyxl>=3.1,<4"]
ui = ["streamlit>=1.40,<2", "pandas>=2.2,<4", "openpyxl>=3.1,<4"]

[project.scripts]
can-lab = "can_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
can_lab = ["data/*.dbc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
